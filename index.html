<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <nav>
        <span style="font-weight: bold; font-size: 20px;">My Shop</span><br>
        <a class="nav-link" href="#">Cosul Meu</a>
        <a class="nav-link" href="#">Profil</a>
        <a class="nav-link" href="#">Inregistrare</a>
    </nav>

    <button class="btn-add-product">Adauga Produs</button>
    <style>
        .nav-link {
            text-decoration: none;
            color: black;
            margin-left: 10px;
        }

        .btn-add-product {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }

        .btn-add-product:hover {
            background-color: #123456;
        }

        .btn-add-product:active {
            background-color: #43B648;
        }
    </style>
</body>

</html>
