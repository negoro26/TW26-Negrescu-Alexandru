<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        td {
            padding: 20px;
            min-height: 50px;
        }
    </style>
</head>

<body>
    <table border="1">
        <tr>
            <td colspan="4"> </td>
            <td colspan="2"> </td>
            <td> </td>
            <td rowspan="2"> </td>
        </tr>

        <tr>
            <td colspan="2" rowspan="2"> </td>
            <td> </td>
            <td colspan="2"> </td>
            <td> </td>
            <td rowspan="2"> </td>

        </tr>


        <tr>
            <td rowspan="2"> </td>
            <td colspan="3"> </td>
            <td rowspan="2"> </td>
        </tr>

        <tr>
            <td></td>
            <td> </td>
            <td></td>
            <td colspan="3"></td>
        </tr>


    </table>
</body>

</html>
